# Packages per platform, read by home/.chezmoiscripts/*install-packages*.
# A script re-runs only when its rendered text changes, i.e. when the list
# for that platform changes. No versions: everything installs latest.
#
# Unix CLI tools (neovim, lazygit, starship, ...) come from mise on every
# distro (home/dot_config/mise/config.toml), so these lists hold only the base
# system packages mise and the shell need.
packages:
  apt:
    - zsh
    - git
    - curl
    - wget
    - unzip
    - tar
    - build-essential
    - tmux
    - fontconfig
  pacman:
    - zsh
    - git
    - curl
    - wget
    - unzip
    - tar
    - base-devel
    - tmux
    - fontconfig
  dnf:
    - zsh
    - git
    - curl
    - wget
    - unzip
    - tar
    - gcc
    - gcc-c++
    - make
    - tmux
    - fontconfig
  brew:
    formulae:
      - git
      - wget
      - tmux
      - FelixKratz/formulae/sketchybar
    casks:
      - font-jetbrains-mono-nerd-font
  # Windows: Scoop, user scope, no admin. An app whose command is already on
  # PATH (installed by winget or a vendor installer) is skipped, not doubled.
  scoop:
    buckets:
      - extras
      - nerd-fonts
    apps:
      # name: scoop app (bucket/app); cmd: PATH guard, "" = app dir only
      - { name: git, cmd: git }
      - { name: pwsh, cmd: pwsh }
      - { name: extras/alacritty, cmd: alacritty }
      - { name: nerd-fonts/JetBrainsMono-NF, cmd: "" }
      - { name: starship, cmd: starship }
      - { name: zoxide, cmd: zoxide }
      - { name: atuin, cmd: atuin }
      - { name: fzf, cmd: fzf }
      - { name: bat, cmd: bat }
      - { name: fd, cmd: fd }
      - { name: eza, cmd: eza }
      - { name: delta, cmd: delta }
      # main/ prefix: a bare `python` makes Scoop resolve a .\Python
      # directory in the cwd instead. The guard ignores the WindowsApps alias.
      - { name: main/python, cmd: python }
      - { name: jq, cmd: jq }
      - { name: ripgrep, cmd: rg }
      - { name: neovim, cmd: nvim }
      # Treesitter parser builds: zig is the C compiler, plus the CLI and cmake.
      - { name: zig, cmd: zig }
      - { name: cmake, cmd: cmake }
      - { name: tree-sitter, cmd: tree-sitter }
      - { name: win32yank, cmd: win32yank }
      - { name: extras/lazygit, cmd: lazygit }
      - { name: uv, cmd: uv }
