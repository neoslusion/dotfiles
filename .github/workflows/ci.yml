name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# gitleaks lists the PR's commits through the API, which needs pull-requests.
permissions:
  contents: read
  pull-requests: read

jobs:
  secrets-scan:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          git ls-files -z '*.sh' 'home/dot_local/bin/executable_*' | xargs -0 shellcheck -S warning

  # The real test: a full `chezmoi init --apply` on a fresh machine, scripts
  # included (packages, mise tools, externals), then `chezmoi verify`.
  apply-unix:
    name: apply (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: ubuntu, os: ubuntu-latest, container: "" }
          - { name: macos, os: macos-latest, container: "" }
          - { name: arch, os: ubuntu-latest, container: "archlinux:latest" }
          - { name: fedora, os: ubuntu-latest, container: "fedora:latest" }
    env:
      # mise downloads from GitHub releases; unauthenticated calls hit rate limits.
      MISE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Container prerequisites (sudo, git, curl)
        if: matrix.container != ''
        # -Syu, never -Sy: a partial upgrade pulls new libraries (openssl)
        # that break the image's installed packages.
        run: |
          if command -v pacman >/dev/null; then pacman -Syu --noconfirm sudo git curl
          else dnf install -y sudo git curl; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install chezmoi
        run: sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin"
      - name: chezmoi init --apply
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          chezmoi init --apply --source "$GITHUB_WORKSPACE"
      - name: Verify
        run: |
          export PATH="$HOME/.local/bin:$HOME/.local/share/mise/shims:$PATH"
          # verify prints nothing on failure; show the diff.
          chezmoi verify || { chezmoi diff; exit 1; }
          nvim --version | head -1
          for t in lazygit starship atuin zoxide fzf eza bat fd rg delta btm herdr; do
            command -v "$t" >/dev/null || { echo "missing: $t"; exit 1; }
          done
          test -f "$HOME/.oh-my-zsh/oh-my-zsh.sh"
          test -d "$HOME/.tmux/plugins/tpm"
          zsh -ic exit

  # Windows runners are elevated and Scoop refuses an elevated shell, so the
  # package script is rendered but not run here; files and the other scripts are.
  apply-windows:
    name: apply (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install chezmoi
        shell: pwsh
        run: iex "&{$(irm 'https://get.chezmoi.io/ps1')} -b '$HOME\bin'"
      - name: chezmoi init --apply
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          & "$HOME\bin\chezmoi.exe" init --source "$env:GITHUB_WORKSPACE"
          & "$HOME\bin\chezmoi.exe" execute-template --file "$env:GITHUB_WORKSPACE\home\.chezmoiscripts\run_onchange_after_10-install-packages.ps1.tmpl" | Out-Null
          & "$HOME\bin\chezmoi.exe" apply --exclude scripts
          & "$HOME\bin\chezmoi.exe" verify --exclude scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
