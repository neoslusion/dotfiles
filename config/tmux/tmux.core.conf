# ============================================================================
# TMUX Core Configuration
# Shared settings, keybindings, and plugin logic
# ============================================================================

# ============================================================================
# GENERAL SETTINGS
# ============================================================================

# Use true color
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# Enable RGB colour
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Increase scrollback buffer
set -g history-limit 50000

# Enable mouse support
set -g mouse on

# No delay for escape key press
set -sg escape-time 0

# Increase repeat time
set -g repeat-time 600

# Focus events enabled for terminals that support them
set -g focus-events on

# Super useful when using "grouped sessions" and multi-monitor setup
setw -g aggressive-resize on

# Status update interval (seconds) - reduces subshell polling CPU wakeups
set -g status-interval 10


# ============================================================================
# KEY BINDINGS (Terminal Workspace layer)
# ============================================================================
# Mirrors herdr's [keys] (config/herdr/config.toml) chord for chord, so both
# muxers feel the same. Herdr binds no other direct chords, so neither does
# tmux: every other Alt/Shift chord reaches the app in the pane. Prefix (C-b)
# bindings stay at tmux's defaults (resize: prefix + Alt/Ctrl+Arrow).

# --- Force Clear Potential Conflicts ---
# Also lists retired chords: a live reload (prefix r) keeps every old binding
# that is not unbound here.
unbind -n M-1; unbind -n M-2; unbind -n M-3; unbind -n M-4; unbind -n M-5
unbind -n M-6; unbind -n M-7; unbind -n M-8; unbind -n M-9
unbind -n M-s; unbind -n M-S; unbind -n M-p; unbind -n M-n; unbind -n M-t
unbind -n M-w; unbind -n M-q; unbind -n M-z; unbind -n M-f; unbind -n M-a
unbind -n M-c
unbind -n M-Space; unbind -n M-g; unbind -n M-b; unbind -n M-B
unbind -n M-Left; unbind -n M-Down; unbind -n M-Up; unbind -n M-Right
unbind -n M-S-Left; unbind -n M-S-Down; unbind -n M-S-Up; unbind -n M-S-Right
unbind -n M-H; unbind -n M-J; unbind -n M-K; unbind -n M-L
unbind -n S-Left; unbind -n S-Right; unbind -n C-M-Left; unbind -n C-M-Right
unbind g

# Alt-1 through Alt-9 jump to a tab (tmux window), like herdr's switch_tab
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Workspace picker (herdr workspaces = tmux sessions). M-w, not M-Space:
# Windows opens the window menu on Alt+Space.
bind -n M-w choose-tree -Zw

# Create/destroy terminal tiles (panes)
bind -n M-n split-window -h -c "#{pane_current_path}"
bind -n M-- split-window -v -c "#{pane_current_path}"
# Confirm first so a stray chord can't kill a pane.
bind -n M-q confirm-before "kill-pane"
bind -n M-t new-window -c "#{pane_current_path}"
bind -n M-z resize-pane -Z # Full Screen / Monocle toggle

# Previous / next tab (tmux window)
bind -n M-[ previous-window
bind -n M-] next-window

# Pane focus with Alt-hjkl, vim-aware: inside Neovim the chord goes to
# vim-tmux-navigator, which moves between splits and crosses into the next
# tmux pane at the edge.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

bind-key -n M-h if-shell "$is_vim" 'send-keys M-h'  'select-pane -L'
bind-key -n M-j if-shell "$is_vim" 'send-keys M-j'  'select-pane -D'
bind-key -n M-k if-shell "$is_vim" 'send-keys M-k'  'select-pane -U'
bind-key -n M-l if-shell "$is_vim" 'send-keys M-l'  'select-pane -R'

# Alt-b toggles the status bar (herdr: the sidebar) for a fully clean screen.
# `set -g status` with no value toggles the boolean.
bind -n M-b set -g status

# Reload config file
unbind r
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Lazygit popup (Alt+g, or prefix then Alt+g)
bind-key M-g display-popup -d "#{pane_current_path}" -w 85% -h 85% -E "lazygit"
bind-key -n M-g display-popup -d "#{pane_current_path}" -w 85% -h 85% -E "lazygit"

# Vi-style copy mode
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection

# --- Clipboard integration ---------------------------------------------------
# Copies (y, mouse drag) must land in the SYSTEM clipboard, not just tmux's
# private buffer. Two channels: OSC 52 to the outer terminal (survives
# SSH), plus copy-command piping to the native tool. Last matching
# if-shell wins: clip.exe (WSL) is checked last so it takes priority there.
set -s set-clipboard on
set -as terminal-features ",*:clipboard"
if-shell 'command -v pbcopy'   "set -s copy-command 'pbcopy'"
if-shell 'command -v xclip'    "set -s copy-command 'xclip -selection clipboard -in'"
if-shell 'command -v wl-copy'  "set -s copy-command 'wl-copy'"
if-shell 'command -v clip.exe' "set -s copy-command 'clip.exe'"

# copy-pipe (no args) pipes through copy-command; falls back to plain copy
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel

# ============================================================================
# PLUGINS (TPM - Tmux Plugin Manager)
# ============================================================================

set -g @plugin 'tmux-plugins/tpm'
# We handle vim-tmux-navigator natively with Alt keys above
# set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-cpu'

# CPU/Memory display settings
set -g @cpu_low_fg_color "#[fg=#9ece6a]"
set -g @cpu_medium_fg_color "#[fg=#e0af68]"
set -g @cpu_high_fg_color "#[fg=#f7768e]"

set -g @ram_low_fg_color "#[fg=#9ece6a]"
set -g @ram_medium_fg_color "#[fg=#e0af68]"
set -g @ram_high_fg_color "#[fg=#f7768e]"

# Resurrect settings
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'

# Continuum settings
set -g @continuum-restore 'off'
set -g @continuum-save-interval '15'

# Initialize TPM (keep this line at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
