# ============================================================================
# Dotbar - minimal centered status bar (port of vaaleyard/tmux-dotbar),
# recolored for Tokyo Night. Static port: no plugin, no shell calls.
# ============================================================================

# Enable true color (24-bit RGB) support
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB"
set -ga terminal-overrides ",*256col*:RGB"

# Allow programs to set terminal colors
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-features ",*256col*:RGB"

# Palette (Tokyo Night):
# accent=#7aa2f7 current=#c0caf5 muted=#565f89 zoom=#7dcfff ink=#16161e

set -g status-position bottom
set -g status-interval 15
set -g status-justify absolute-centre
set -g status-left-length 40
set -g status-right-length 20

# Bar blends into the terminal background; everything is quiet text
set -g status-style "bg=default,fg=#565f89"
set -g window-status-style "bg=default,fg=#565f89"
set -g window-status-current-style "bg=default,fg=#c0caf5"

# Session (left): muted name; while prefix is held it becomes a rounded
# accent pill. Styles inside #{?...} use chained single-attribute #[..]
# blocks — commas inside a conditional branch break the tmux <= 3.4 parser.
set -g status-left "#{?client_prefix,#[fg=#7aa2f7]#[fg=#16161e]#[bg=#7aa2f7]#S#[bg=default]#[fg=#7aa2f7],#[fg=#565f89] #S } "

# Windows (centre): plain names, dot separators. SSH windows get a link
# icon (static check on pane_current_command — no shell calls); the active
# window shows the zoom flag when maximized.
set -g window-status-format " #{?#{==:#{pane_current_command},ssh},󰌘 ,}#W "
set -g window-status-current-format " #{?#{==:#{pane_current_command},ssh},󰌘 ,}#W#{?window_zoomed_flag, #[fg=#7dcfff]󰊓,} "
set -g window-status-separator " • "

# Clock (right)
set -g status-right "#[fg=#565f89]%H:%M "

set -g window-status-bell-style "bg=#7aa2f7,fg=#16161e,bold"
set -g window-status-activity-style "bg=default,fg=#c0caf5"

set -g pane-border-style "fg=#2a2b3d"
set -g pane-active-border-style "fg=#7aa2f7"
set -g message-style "bg=#7aa2f7,fg=#15161e,bold"
set -g display-panes-active-colour "#7dcfff"
set -g display-panes-colour "#565f89"
set -g display-time 1200

setw -g automatic-rename off
set-option -g allow-rename off
