# ============================================================================
# TMUX Configuration Entry Point
# ============================================================================

# 1. Load Core Configuration (Shared Logic)
# Note: tmux doesn't expand ~, so we use $HOME which tmux can resolve
source-file "$HOME/.config/tmux/tmux.core.conf"

# 2. Load Theme (Symlinked by installer/switcher)
# Use -q flag to silently ignore if file doesn't exist, preventing tmux startup failure
# If theme.conf is missing, tmux will still start with default styling from core.conf
source-file -q "$HOME/.config/tmux/theme.conf"
