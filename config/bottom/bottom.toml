# Bottom Configuration - System Monitor
# Tokyo Night Storm Theme

# ============================================================================
# DISPLAY
# ============================================================================

[flags]
# Basic display
battery = true
disable_click = false
dot_marker = false
left_legend = false
current_usage = true
group_processes = true
case_sensitive = false
whole_word = false
regex = false
show_table_scroll_position = true
process_command = false
disable_advanced_kill = false

# Update rate (in milliseconds)
rate = 1000

# Temperature type (celsius, fahrenheit, kelvin)
temperature_type = "celsius"

# Default time value (in milliseconds)
default_time_value = 60000

# Default widget type
default_widget_type = "proc"
default_widget_count = 1

# Expanded on start
expanded_on_startup = true

# Use old network legend
use_old_network_legend = false

# Hide time scaling
hide_time = false

# Autohide time
autohide_time = false

# Basic mode
basic = false

# Tree mode
tree = false

# Show table scroll position
show_table_scroll_position = true

# Process memory as value
process_memory_as_value = false

# Disable CPU
disable_cpu = false

# Disable memory
disable_memory = false

# Disable swap
disable_swap = false

# Disable network
disable_network = false

# Network use binary prefix
network_use_binary_prefix = false

# Network use bytes
network_use_bytes = false

# ============================================================================
# COLORS - Tokyo Night Storm Theme
# ============================================================================

[colors]
# Professional Tokyo Night Storm colors
table_header_color = "#7aa2f7"
all_cpu_color = "#7dcfff"
avg_cpu_color = "#7aa2f7"
cpu_core_colors = [
    "#7dcfff",
    "#7aa2f7",
    "#bb9af7",
    "#9ece6a",
    "#e0af68",
    "#f7768e",
]

ram_color = "#7dcfff"
swap_color = "#bb9af7"
rx_color = "#9ece6a"
tx_color = "#f7768e"
rx_total_color = "#73daca"
tx_total_color = "#ff9e64"

border_color = "#3b4261"
highlighted_border_color = "#7aa2f7"
text_color = "#c0caf5"
selected_text_color = "#1f2335"
selected_bg_color = "#7aa2f7"
widget_title_color = "#c0caf5"
graph_color = "#7aa2f7"
high_battery_color = "#9ece6a"
medium_battery_color = "#e0af68"
low_battery_color = "#f7768e"

# ============================================================================
# LAYOUT
# ============================================================================

# Professional layout - clean and informative
[[row]]
  ratio = 30
  [[row.child]]
    type = "cpu"
    ratio = 2
  [[row.child]]
    type = "mem"
    ratio = 1
  [[row.child]]
    type = "temp"
    ratio = 1

[[row]]
  ratio = 40
  [[row.child]]
    type = "proc"
    default = true

[[row]]
  ratio = 30
  [[row.child]]
    type = "net"
    ratio = 1
  [[row.child]]
    type = "disk"
    ratio = 2
