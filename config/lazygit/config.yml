# Lazygit Configuration - Tokyo Night Storm Theme
# Beautiful Git TUI with matching colors

gui:
  # Theme
  theme:
    activeBorderColor:
      - '#7aa2f7' # Tokyo Night blue
      - bold
    inactiveBorderColor:
      - '#3b4261' # Tokyo Night dark gray
    optionsTextColor:
      - '#7dcfff' # Tokyo Night cyan
    selectedLineBgColor:
      - '#292e42' # Tokyo Night selection
    selectedRangeBgColor:
      - '#292e42' # Tokyo Night selection
    cherryPickedCommitBgColor:
      - '#7aa2f7' # Tokyo Night blue
    cherryPickedCommitFgColor:
      - '#c0caf5' # Tokyo Night foreground
    unstagedChangesColor:
      - '#f7768e' # Tokyo Night red
    defaultFgColor:
      - '#c0caf5' # Tokyo Night foreground
  # Window management
  screenMode: 'normal'
  scrollHeight: 2
  scrollPastBottom: true
  sidePanelWidth: 0.3333
  expandFocusedSidePanel: false
  mainPanelSplitMode: 'flexible'
  # Professional appearance
  showIcons: false # No icons, professional text only
  showFileTree: true
  showRandomTip: false
  showBranchCommitHash: true
  showBottomLine: true
  showCommandLog: false
  showListFooter: true
  nerdFontsVersion: "" # Disable nerd fonts
  # Performance
  skipDiscardChangeWarning: false
  skipStashWarning: false
# Git settings
git:
  pagers:
    - colorArg: always
      pager: delta --dark --paging=never
  commit:
    signOff: false
    autoWrapCommitMessage: true
    autoWrapWidth: 72
  merging:
    manualCommit: false
    args: ''
  log:
    order: 'topo-order'
    showGraph: 'always'
    showWholeGraph: false
  skipHookPrefix: WIP
  autoFetch: true
  autoRefresh: true
  branchLogCmd: 'git log --graph --color=always --abbrev-commit --decorate --date=relative --pretty=medium {{branchName}} --'
  overrideGpg: false
  disableForcePushing: false
  parseEmoji: false
  allBranchesLogCmds:
    - git log --graph --all --color=always --abbrev-commit --decorate --date=relative --pretty=medium
# OS specific
os:
  editCommand: '' # Use $EDITOR
  editCommandTemplate: '{{editor}} {{filename}}'
  openCommand: ''
# Updates
update:
  method: prompt
  days: 14
# Refresh on return
refresher:
  refreshInterval: 10
  fetchInterval: 60
# Confirm on quit
confirmOnQuit: false
# Quit on escape
quitOnTopLevelReturn: false
# Custom commands (optional - can be extended)
customCommands:
  - key: '<c-r>'
    command: 'git rebase -i HEAD~{{.Form.NumberOfCommits}}'
    context: 'commits'
    prompts:
      - type: 'input'
        title: 'How many commits to rebase?'
        key: 'NumberOfCommits'
        initialValue: '5'
  - key: 'P'
    command: 'git push --force-with-lease'
    context: 'global'
    description: 'Force push with lease (safer)'
  - key: '<c-t>'
    command: 'git tag {{.Form.TagName}} -m "{{.Form.TagMessage}}"'
    context: 'commits'
    description: 'Create tag'
    prompts:
      - type: 'input'
        title: 'Tag name:'
        key: 'TagName'
      - type: 'input'
        title: 'Tag message:'
        key: 'TagMessage'
# Keybindings
keybinding:
  universal:
    quit: 'q'
    quit-alt1: '<c-c>'
    return: '<esc>'
    quitWithoutChangingDirectory: 'Q'
    togglePanel: '<tab>'
    prevItem: '<up>'
    nextItem: '<down>'
    prevItem-alt: 'k'
    nextItem-alt: 'j'
    prevPage: ','
    nextPage: '.'
    scrollLeft: 'H'
    scrollRight: 'L'
    gotoTop: '<'
    gotoBottom: '>'
    prevBlock: '<left>'
    nextBlock: '<right>'
    prevBlock-alt: 'h'
    nextBlock-alt: 'l'
    nextMatch: 'n'
    prevMatch: 'N'
    startSearch: '/'
    optionMenu: 'x'
    optionMenu-alt1: '?'
    select: '<space>'
    goInto: '<enter>'
    confirm: '<enter>'
    remove: 'd'
    new: 'n'
    edit: 'e'
    openFile: 'o'
    scrollUpMain: '<pgup>'
    scrollDownMain: '<pgdown>'
    scrollUpMain-alt1: 'K'
    scrollDownMain-alt1: 'J'
    scrollUpMain-alt2: '<c-u>'
    scrollDownMain-alt2: '<c-d>'
    executeShellCommand: ':'
    createRebaseOptionsMenu: 'm'
    pushFiles: 'P'
    pullFiles: 'p'
    refresh: 'R'
    createPatchOptionsMenu: '<c-p>'
    nextTab: ']'
    prevTab: '['
    nextScreenMode: '+'
    prevScreenMode: '_'
    undo: 'z'
    redo: '<c-z>'
    filteringMenu: '<c-s>'
    diffingMenu: 'W'
    diffingMenu-alt: '<c-e>'
    copyToClipboard: '<c-o>'
    openRecentRepos: '<c-r>'
    submitEditorText: '<enter>'
    extrasMenu: '@'
    toggleWhitespaceInDiffView: '<c-w>'
    increaseContextInDiffView: '}'
    decreaseContextInDiffView: '{'
  status:
    checkForUpdate: 'u'
    recentRepos: '<enter>'
  files:
    commitChanges: 'c'
    commitChangesWithoutHook: 'w'
    amendLastCommit: 'A'
    commitChangesWithEditor: 'C'
    ignoreFile: 'i'
    refreshFiles: 'r'
    stashAllChanges: 's'
    viewStashOptions: 'S'
    toggleStagedAll: 'a'
    viewResetOptions: 'D'
    fetch: 'f'
    toggleTreeView: '`'
    openMergeOptions: 'M'
    openStatusFilter: '<c-b>'
  branches:
    createPullRequest: 'o'
    viewPullRequestOptions: 'O'
    checkoutBranchByName: 'c'
    forceCheckoutBranch: 'F'
    rebaseBranch: 'r'
    renameBranch: 'R'
    mergeIntoCurrentBranch: 'M'
    viewGitFlowOptions: 'i'
    fastForward: 'f'
    pushTag: 'P'
    setUpstream: 'u'
    fetchRemote: 'f'
  commits:
    squashDown: 's'
    renameCommit: 'r'
    renameCommitWithEditor: 'R'
    viewResetOptions: 'g'
    markCommitAsFixup: 'f'
    createFixupCommit: 'F'
    squashAboveCommits: 'S'
    moveDownCommit: '<c-j>'
    moveUpCommit: '<c-k>'
    amendToCommit: 'A'
    pickCommit: 'p'
    revertCommit: 't'
    cherryPickCopy: 'c'
    cherryPickCopyRange: 'C'
    pasteCommits: 'v'
    tagCommit: 'T'
    checkoutCommit: '<space>'
    resetCherryPick: '<c-f>'
    copyCommitMessageToClipboard: '<c-y>'
    openLogMenu: '<c-l>'
    viewBisectOptions: 'b'
  stash:
    popStash: 'g'
    renameStash: 'r'
  commitFiles:
    checkoutCommitFile: 'c'
  main:
    toggleDragSelect: 'v'
    toggleDragSelect-alt: 'V'
    toggleSelectHunk: 'a'
    pickBothHunks: 'b'
  submodules:
    init: 'i'
    update: 'u'
    bulkMenu: 'b'
